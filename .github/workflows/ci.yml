name: CI

on:
  push:
    branches: [main, mobile-layout]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'   # 서버 런타임과 동일하게 고정
          cache: npm

      - name: install
        run: npm ci

      # AGENTS.md 불변규칙 8 — 이 둘을 통과하지 못하면 완료가 아니다.
      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

      # 서버가 이 결론을 읽고 배포 여부를 스스로 판단한다.
      - name: mark verified
        if: success()
        run: echo "verified ${{ github.sha }}"
