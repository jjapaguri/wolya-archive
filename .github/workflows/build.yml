name: Build

# 코드가 올라올 때마다 GitHub에서 빌드가 되는지 자동으로 검사한다.
# 여기서 초록불이 떠야 서버에 배포해도 안전하다.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build
